server {
    listen 80;
    server_name social.lexmakesit.com;

    root /var/www/social;
    index index.html;

    # Clean URLs — /legal/terms → /legal/terms.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Explicit legal routes without .html extension
    location = /legal/terms {
        try_files /legal/terms.html =404;
    }
    location = /legal/privacy {
        try_files /legal/privacy.html =404;
    }

    # Proxy OAuth + API routes to Agentop backend (when running locally via tunnel or on server)
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /social/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
