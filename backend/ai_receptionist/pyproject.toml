[tool.poetry]
name = "ai-receptionist"
version = "0.1.0"
description = "AI receptionist service using FastAPI with SOLID architecture and Twilio webhook stub"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
  { include = "ai_receptionist", from = ".." },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.118.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = { version = "^2.8.0", extras = ["email"] }
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"
httpx = ">=0.24.0,<0.28.0"
twilio = "^9.0.0"
python-multipart = "^0.0.9"
# Database
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg2-binary = "^2.9"
# Auth
PyJWT = "^2.10"
passlib = { version = "^1.7", extras = ["bcrypt"] }
bcrypt = "^4.0"
# Cache
redis = "^5.0"
# AI / async
openai = "^1.0"
aiohttp = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.6.0"
black = "^24.8.0"
mypy = "^1.11.0"
types-requests = "^2.32.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
