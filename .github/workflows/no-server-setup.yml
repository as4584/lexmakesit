name: Keep server setup out of this public repo

# The server setup (infra/, docs/infra/, systemd units, compose env files,
# keys) lives in the private repo as4584/lexmakesit-private only.
#
# GitHub cannot block such a push on a personally owned public repo, so this
# runs after the fact: on every push that carries this file, and every 15
# minutes from main to catch branches that do not. Any branch or tag whose
# files match is deleted, and the run fails so the owner is emailed.
# main is never deleted; a match there only fails the run.
#
# The same patterns are in the local pre-push hook
# (C:\Users\AlexS\Automations\git-hooks\lexmakesit-pre-push); keep them in sync.

on:
  push:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: no-server-setup
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan every branch and tag
        shell: bash
        run: |
          set -uo pipefail
          pattern='^infra/|^docs/infra/|\.service$|(^|/)compose\.env|(^|/)\.env($|\.)|\.pem$|\.key$'
          git fetch --quiet --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

          found=0
          while read -r sha ref; do
            hits=$(git ls-tree -r --name-only "$sha" | grep -E "$pattern" | grep -v '\.example$' || true)
            [ -z "$hits" ] && continue
            found=1
            short=${ref#refs/remotes/origin/}
            short=${short#refs/tags/}
            echo "::error::$ref contains server setup files:"
            echo "$hits" | head -20 | sed 's/^/    /'
            if [ "$ref" = "refs/remotes/origin/main" ]; then
              echo "::error::main is not deleted automatically; remove these files from main."
            elif [[ "$ref" == refs/tags/* ]]; then
              git push --quiet origin --delete "refs/tags/$short" && echo "Deleted tag $short"
            else
              git push --quiet origin --delete "refs/heads/$short" && echo "Deleted branch $short"
            fi
          done < <(git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin refs/tags | grep -v ' refs/remotes/origin/HEAD$')

          if [ "$found" = 1 ]; then
            echo "Server setup files were found and removed. Push them to the private repo instead."
            exit 1
          fi
          echo "No server setup files in any branch or tag."
