name: CI — Portfolio

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/portfolio/**"
      - ".github/workflows/ci-portfolio.yml"
      - "scripts/ci/portfolio-*.sh"
  pull_request:
    paths:
      - "frontend/portfolio/**"
      - ".github/workflows/ci-portfolio.yml"
      - "scripts/ci/portfolio-*.sh"

defaults:
  run:
    shell: bash

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Test + security scan
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portfolio

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/portfolio/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit safety

      - name: Security scan
        run: |
          # Ignoring known low-risk Starlette CVEs blocked by FastAPI upstream
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2025-54121 \
            --ignore-vuln CVE-2025-62727 \
            --ignore-vuln CVE-2024-23342 || true
          safety check -r requirements.txt --ignore 70612 --ignore 73683 || true

      - name: Run tests
        run: pytest -q --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # Docker image build + smoke test (main branch only)
  # ──────────────────────────────────────────────────────────────────────────
  image:
    name: Image build + smoke test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-portfolio

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: frontend/portfolio
          push: false
          tags: |
            ghcr.io/${{ github.repository }}-portfolio:ci-${{ github.run_id }}
          load: true

      - name: Smoke test — health endpoint
        run: |
          docker run -d --name portfolio-smoke \
            -e ENVIRONMENT=ci \
            -p 8010:8000 \
            ghcr.io/${{ github.repository }}-portfolio:ci-${{ github.run_id }}

          for i in $(seq 1 15); do
            HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8010/health 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✓ portfolio /health returned 200"
              break
            fi
            [ "$i" -eq 15 ] && (docker logs portfolio-smoke; exit 1)
            sleep 2
          done

          docker stop portfolio-smoke

      - name: Push image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: frontend/portfolio
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-portfolio:${{ github.run_id }}
            ghcr.io/${{ github.repository }}-portfolio:latest

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy (main + image passed)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production (blue/green)
    needs: image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOPPLER_TOKEN
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/${{ github.repository }}-portfolio:${{ github.run_id }}"

            # Install Doppler CLI if not present
            command -v doppler >/dev/null 2>&1 || \
              (curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh)

            # Login to GHCR using GHCR_TOKEN stored in Doppler
            doppler secrets get GHCR_TOKEN --plain | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull "$IMAGE"

            # Blue/green slot selection
            ACTIVE=$(docker ps --filter "name=portfolio_blue" --format "{{.Names}}" | head -1)
            if [ -n "$ACTIVE" ]; then
              NEW_SLOT=green; OLD_SLOT=blue
            else
              NEW_SLOT=blue; OLD_SLOT=green
            fi

            SECRETS_FILE=$(mktemp)
            chmod 600 "$SECRETS_FILE"
            doppler secrets download --format env --no-file > "$SECRETS_FILE"

            docker run -d \
              --name "portfolio_${NEW_SLOT}" \
              --env-file "$SECRETS_FILE" \
              -p 8011:8000 \
              "$IMAGE"

            rm -f "$SECRETS_FILE"

            PASS=0
            for _ in $(seq 1 30); do
              HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8011/health || echo "000")
              if [ "$HTTP" = "200" ]; then
                PASS=$((PASS+1))
                [ "$PASS" -ge 3 ] && break
              else
                PASS=0
              fi
              sleep 2
            done

            if [ "$PASS" -lt 3 ]; then
              echo "Portfolio health check failed — rolling back"
              docker rm -f "portfolio_${NEW_SLOT}" || true
              exit 1
            fi

            docker rm -f "portfolio_${OLD_SLOT}" 2>/dev/null || true
