name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.PORTFOLIO_SSH_KEY }}
          source: "backend/"
          target: "/opt/ai-receptionist/"
          strip_components: 1

      - name: Rebuild, migrate, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.PORTFOLIO_SSH_KEY }}
          script: |
            cd /opt/ai-receptionist
            docker compose -f docker-compose.prod.yml build app
            docker compose -f docker-compose.prod.yml run --rm app alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d app
            docker compose -f docker-compose.prod.yml exec -T app python scripts/fix_lex_account.py || true
