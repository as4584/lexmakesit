name: CI — Backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
      - "scripts/ci/backend-*.sh"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
      - "scripts/ci/backend-*.sh"

defaults:
  run:
    shell: bash

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Lint + test (with real Redis and Postgres service containers)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai_receptionist

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_ai_receptionist
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_ai_receptionist
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      STRUCTURED_LOGGING: "true"
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      # ── Lock file consistency check ──────────────────────────────────────
      # This MUST run before `poetry install`.  If pyproject.toml is edited
      # without running `poetry lock` locally, Poetry 2.x refuses to install
      # with a cryptic error.  This step surfaces the real problem clearly.
      #
      # Long-term prevention: install the pre-commit hook in .pre-commit-config.yaml
      # so this is caught LOCALLY before the code ever reaches CI:
      #   pip install pre-commit && pre-commit install
      - name: Verify lock file is consistent with pyproject.toml
        run: |
          poetry check || {
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  LOCK FILE DRIFT DETECTED"
            echo "  pyproject.toml was edited without regenerating poetry.lock."
            echo ""
            echo "  Fix (run locally, then commit):"
            echo "    cd backend/ai_receptionist"
            echo "    poetry lock"
            echo "    git add poetry.lock && git commit --amend --no-edit"
            echo ""
            echo "  Prevent forever: pre-commit install  (see .pre-commit-config.yaml)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          }

      - name: Install dependencies
        run: poetry install

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Format check (black)
        # --check --diff: show exact diff of what black would change so the fix is obvious
        run: poetry run black --check --diff .

      # ── Critical guards run first, verbosely ────────────────────────────
      # test_call_health: guards the call pipeline (WebSocket, TwiML, deps)
      # test_auth_lifecycle: guards auth signup/login/token flow
      # These run BEFORE the full suite so a critical breakage is obvious
      # immediately rather than buried in hundreds of test lines.
      - name: Critical guards (call health + auth lifecycle)
        run: poetry run pytest -v --tb=long tests/test_call_health.py tests/test_auth_lifecycle.py

      # ── Full test suite (everything else) ───────────────────────────────
      - name: Test suite
        run: poetry run pytest -q --tb=short --ignore=tests/test_call_health.py --ignore=tests/test_auth_lifecycle.py

  # ──────────────────────────────────────────────────────────────────────────
  # Docker image build + smoke test (main branch only)
  # ──────────────────────────────────────────────────────────────────────────
  image:
    name: Image build + smoke test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          load: true

      - name: Smoke test — liveness + readiness
        run: |
          trap 'docker rm -f smoke 2>/dev/null || true' EXIT
          docker run -d --name smoke \
            -e JWT_SECRET_KEY=smoke-test-key \
            -e ENVIRONMENT=ci \
            -p 8002:8002 \
            ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}

          for i in $(seq 1 15); do
            STATUS=$(curl -sf http://localhost:8002/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "✓ /health returned ok"
              break
            fi
            [ "$i" -eq 15 ] && (docker logs smoke; exit 1)
            sleep 2
          done

          # Readiness is allowed to return 200 or 503 (no DB in smoke run)
          HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8002/readiness)
          echo "readiness returned HTTP $HTTP"
          [[ "$HTTP" == "200" || "$HTTP" == "503" ]] || exit 1

      # ── Critical: verify websockets is importable in the built image ─────────
      # Uvicorn silently rejects ALL WebSocket upgrades when this package is
      # missing — that was the exact production outage.  A non-zero exit here
      # blocks the push before anything reaches production.
      - name: Smoke test — websockets library present in image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          docker run --rm "$IMAGE" \
            python -c "import websockets; print('websockets OK:', websockets.__version__)"

      - name: Smoke test — aiohttp library present in image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          docker run --rm "$IMAGE" \
            python -c "import aiohttp; print('aiohttp OK:', aiohttp.__version__)"

      # ── cryptography must be importable — its absence causes backend startup ──
      # failure (encryption.py imports from it) and every endpoint returns     ──
      # "Failed to fetch" because the process can't listen on port 8002.       ──
      - name: Smoke test — cryptography library present in image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          docker run --rm "$IMAGE" \
            python -c "import cryptography; print('cryptography OK:', cryptography.__version__)"

      # ── Twilio webhook TwiML check ────────────────────────────────────────
      # Starts the container (no DB) and verifies /twilio/voice returns XML.
      # A 404 or 500 here means the call pipeline is broken.
      - name: Smoke test — Twilio webhook returns TwiML
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          trap 'docker rm -f twilio_smoke 2>/dev/null || true' EXIT
          docker run -d --name twilio_smoke \
            -e JWT_SECRET_KEY=smoke-test-key \
            -e ENVIRONMENT=ci \
            -p 8003:8002 \
            "$IMAGE"

          for i in $(seq 1 15); do
            HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8003/health 2>/dev/null || echo "")
            [ "$HTTP" = "200" ] && break
            [ "$i" -eq 15 ] && (docker logs twilio_smoke; exit 1)
            sleep 2
          done

          RESPONSE=$(curl -s -o /tmp/twiml.xml -w "%{http_code}" \
            -X POST http://localhost:8003/twilio/voice \
            -d "CallSid=CI_smoke_001&From=%2B15550001111&To=%2B12298215986")

          echo "HTTP status: $RESPONSE"
          [ "$RESPONSE" = "200" ] || (cat /tmp/twiml.xml; docker logs twilio_smoke; exit 1)

          # Must contain <Connect> and <Stream — key TwiML elements
          grep -q "<Connect>" /tmp/twiml.xml || (echo "TwiML missing <Connect>"; cat /tmp/twiml.xml; exit 1)
          grep -q "<Stream"    /tmp/twiml.xml || (echo "TwiML missing <Stream>";  cat /tmp/twiml.xml; exit 1)
          grep -q "to="        /tmp/twiml.xml || (echo "Stream URL missing ?to= param"; cat /tmp/twiml.xml; exit 1)

          echo "✓ TwiML structure OK"

      # ── Auth endpoint smoke test ──────────────────────────────────────────
      # Signs up a test user then logs in.  If this fails it means the backend
      # can't serve auth requests — the exact cause of "Failed to fetch" on the
      # sign-in page.  A missing dependency (e.g. cryptography) or a broken DB
      # migration would surface here before reaching production.
      - name: Smoke test — auth signup + login returns JWT
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          trap 'docker rm -f auth_smoke 2>/dev/null || true' EXIT
          docker run -d --name auth_smoke \
            -e JWT_SECRET_KEY=smoke-auth-key-1234 \
            -e ENCRYPTION_SALT=dGVzdC1zYWx0LWZvci1jaS10ZXN0aW5n \
            -e ENCRYPTION_KEY=dGVzdC1rZXktZm9yLWNpLXRlc3Rpbmc= \
            -e ENVIRONMENT=ci \
            -e DATABASE_URL=sqlite:////tmp/smoke_auth.db \
            -p 8004:8002 \
            "$IMAGE"

          # Wait for the container to be healthy
          for i in $(seq 1 20); do
            HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8004/health 2>/dev/null || echo "")
            [ "$HTTP" = "200" ] && break
            [ "$i" -eq 20 ] && (docker logs auth_smoke; exit 1)
            sleep 2
          done
          echo "✓ Backend is healthy"

          # Run Alembic migrations so the auth tables exist.
          # WORKDIR in the image is /app — alembic.ini and alembic/ live there directly
          # (copied from backend/ by the Dockerfile COPY . .). The ini's script_location
          # is "alembic", which resolves relative to /app — so no -c flag override needed.
          docker exec auth_smoke sh -c "cd /app && python -m alembic upgrade head" 2>&1 || {
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  MIGRATION FAILED — auth tables may be missing"
            echo "  Container logs follow:"
            docker logs auth_smoke
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          }

          # Signup — use example.com (RFC 2606 reserved for docs/testing, always valid)
          # Do NOT use .test, .local, .invalid, .localhost — pydantic email-validator
          # rejects them as special-use TLDs (RFC 6761).
          SIGNUP=$(curl -s -o /tmp/signup.json -w "%{http_code}" \
            -X POST http://localhost:8004/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@example.com","password":"Smoke1234!","full_name":"CI Smoke","business_name":"Smoke Co"}')

          echo "Signup HTTP: $SIGNUP"
          cat /tmp/signup.json
          [ "$SIGNUP" = "200" ] || (docker logs auth_smoke; exit 1)
          grep -q "access_token" /tmp/signup.json || (echo "No access_token in signup response"; exit 1)

          # Login
          LOGIN=$(curl -s -o /tmp/login.json -w "%{http_code}" \
            -X POST http://localhost:8004/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@example.com","password":"Smoke1234!"}')

          echo "Login HTTP: $LOGIN"
          cat /tmp/login.json
          [ "$LOGIN" = "200" ] || (echo "Login returned $LOGIN — auth is broken"; docker logs auth_smoke; exit 1)
          grep -q "access_token" /tmp/login.json || (echo "No access_token in login response"; exit 1)

          echo "✓ Auth signup + login OK"

      - name: Push image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.run_id }}
            ghcr.io/${{ github.repository }}:latest

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy (main + image build passed)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production (blue/green)
    needs: image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOPPLER_TOKEN
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/${{ github.repository }}:${{ github.run_id }}"

            # Install Doppler CLI if not present
            command -v doppler >/dev/null 2>&1 || \
              (curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh)

            # Login to GHCR using GHCR_TOKEN stored in Doppler
            doppler secrets get GHCR_TOKEN --plain | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull "$IMAGE"

            # ── Phase 1: Staging health check on port 8003 ──────────────────
            # Verify the new image is healthy BEFORE touching production traffic.
            # Caddy proxies to 127.0.0.1:8002 — port 8003 is only used for this
            # pre-flight check and carries zero real traffic.
            SECRETS_FILE=$(mktemp)
            chmod 600 "$SECRETS_FILE"
            doppler secrets download --format env --no-file > "$SECRETS_FILE"

            docker rm -f ai_receptionist_staging 2>/dev/null || true
            docker run -d \
              --name ai_receptionist_staging \
              --env-file "$SECRETS_FILE" \
              -p 8003:8002 \
              "$IMAGE"

            rm -f "$SECRETS_FILE"

            # 3 consecutive 200s on /readiness before promoting
            PASS=0
            for _ in $(seq 1 30); do
              HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8003/readiness || echo "000")
              if [ "$HTTP" = "200" ]; then
                PASS=$((PASS+1))
                [ "$PASS" -ge 3 ] && break
              else
                PASS=0
              fi
              sleep 2
            done

            if [ "$PASS" -lt 3 ]; then
              echo "Staging health check failed — aborting deploy"
              docker logs ai_receptionist_staging
              docker rm -f ai_receptionist_staging || true
              exit 1
            fi

            docker rm -f ai_receptionist_staging

            # ── Phase 2: Atomic swap on port 8002 ───────────────────────────
            # Caddy routes to 127.0.0.1:8002.  The swap window is the time for
            # docker run to bind port 8002 (typically < 1 s).  The new container
            # joins lex_net so it can reach postgres/redis by hostname.
            SECRETS_FILE=$(mktemp)
            chmod 600 "$SECRETS_FILE"
            doppler secrets download --format env --no-file > "$SECRETS_FILE"

            # Stop every current application container (docker-compose OR previous CI deploy)
            docker rm -f ai-receptionist-app-1 ai_receptionist_active \
                         ai_receptionist_blue ai_receptionist_green 2>/dev/null || true

            docker run -d \
              --name ai_receptionist_active \
              --network lex_net \
              --restart unless-stopped \
              --env-file "$SECRETS_FILE" \
              -p 8002:8002 \
              "$IMAGE"

            rm -f "$SECRETS_FILE"

            # ── Phase 3: Post-swap verification on :8002 ────────────────────
            PASS=0
            for _ in $(seq 1 15); do
              HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8002/readiness || echo "000")
              if [ "$HTTP" = "200" ]; then
                PASS=$((PASS+1))
                [ "$PASS" -ge 3 ] && break
              else
                PASS=0
              fi
              sleep 2
            done

            if [ "$PASS" -lt 3 ]; then
              echo "Post-swap health check failed on :8002 — deploy may need manual rollback"
              docker logs ai_receptionist_active
              exit 1
            fi

            echo "Deploy complete — ai_receptionist_active is serving on :8002"
