name: CI — Backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
      - "scripts/ci/backend-*.sh"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
      - "scripts/ci/backend-*.sh"

defaults:
  run:
    shell: bash

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Lint + test (with real Redis and Postgres service containers)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai_receptionist

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_ai_receptionist
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_ai_receptionist
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      STRUCTURED_LOGGING: "true"
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Format check (black)
        # --check --diff: show exact diff of what black would change so the fix is obvious
        run: poetry run black --check --diff .

      # Run the full test suite including the new auth lifecycle tests
      - name: Test suite
        run: poetry run pytest -q --tb=short

      # Explicitly run call-health + auth lifecycle guards (loud failure)
      - name: Call health guard
        run: poetry run pytest -q --tb=short tests/test_call_health.py tests/test_auth_lifecycle.py -v

  # ──────────────────────────────────────────────────────────────────────────
  # Docker image build + smoke test (main branch only)
  # ──────────────────────────────────────────────────────────────────────────
  image:
    name: Image build + smoke test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          load: true

      - name: Smoke test — liveness + readiness
        run: |
          docker run -d --name smoke \
            -e JWT_SECRET_KEY=smoke-test-key \
            -e ENVIRONMENT=ci \
            -p 8002:8002 \
            ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}

          for i in $(seq 1 15); do
            STATUS=$(curl -sf http://localhost:8002/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "✓ /health returned ok"
              break
            fi
            [ "$i" -eq 15 ] && (docker logs smoke; exit 1)
            sleep 2
          done

          # Readiness is allowed to return 200 or 503 (no DB in smoke run)
          HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8002/readiness)
          echo "readiness returned HTTP $HTTP"
          [[ "$HTTP" == "200" || "$HTTP" == "503" ]] || exit 1

          docker stop smoke

      # ── Critical: verify websockets is importable in the built image ─────────
      # Uvicorn silently rejects ALL WebSocket upgrades when this package is
      # missing — that was the exact production outage.  A non-zero exit here
      # blocks the push before anything reaches production.
      - name: Smoke test — websockets library present in image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          docker run --rm "$IMAGE" \
            python -c "import websockets; print('websockets OK:', websockets.__version__)"

      - name: Smoke test — aiohttp library present in image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          docker run --rm "$IMAGE" \
            python -c "import aiohttp; print('aiohttp OK:', aiohttp.__version__)"

      # ── cryptography must be importable — its absence causes backend startup ──
      # failure (encryption.py imports from it) and every endpoint returns     ──
      # "Failed to fetch" because the process can't listen on port 8002.       ──
      - name: Smoke test — cryptography library present in image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          docker run --rm "$IMAGE" \
            python -c "import cryptography; print('cryptography OK:', cryptography.__version__)"

      # ── Twilio webhook TwiML check ────────────────────────────────────────
      # Starts the container (no DB) and verifies /twilio/voice returns XML.
      # A 404 or 500 here means the call pipeline is broken.
      - name: Smoke test — Twilio webhook returns TwiML
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          docker run -d --name twilio_smoke \
            -e JWT_SECRET_KEY=smoke-test-key \
            -e ENVIRONMENT=ci \
            -p 8003:8002 \
            "$IMAGE"

          for i in $(seq 1 15); do
            HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8003/health 2>/dev/null || echo "")
            [ "$HTTP" = "200" ] && break
            [ "$i" -eq 15 ] && (docker logs twilio_smoke; exit 1)
            sleep 2
          done

          RESPONSE=$(curl -s -o /tmp/twiml.xml -w "%{http_code}" \
            -X POST http://localhost:8003/twilio/voice \
            -d "CallSid=CI_smoke_001&From=%2B15550001111&To=%2B12298215986")

          echo "HTTP status: $RESPONSE"
          [ "$RESPONSE" = "200" ] || (cat /tmp/twiml.xml; docker logs twilio_smoke; exit 1)

          # Must contain <Connect> and <Stream — key TwiML elements
          grep -q "<Connect>" /tmp/twiml.xml || (echo "TwiML missing <Connect>"; cat /tmp/twiml.xml; exit 1)
          grep -q "<Stream"    /tmp/twiml.xml || (echo "TwiML missing <Stream>";  cat /tmp/twiml.xml; exit 1)
          grep -q "to="        /tmp/twiml.xml || (echo "Stream URL missing ?to= param"; cat /tmp/twiml.xml; exit 1)

          echo "✓ TwiML structure OK"
          docker stop twilio_smoke

      # ── Auth endpoint smoke test ──────────────────────────────────────────
      # Signs up a test user then logs in.  If this fails it means the backend
      # can't serve auth requests — the exact cause of "Failed to fetch" on the
      # sign-in page.  A missing dependency (e.g. cryptography) or a broken DB
      # migration would surface here before reaching production.
      - name: Smoke test — auth signup + login returns JWT
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}
          docker run -d --name auth_smoke \
            -e JWT_SECRET_KEY=smoke-auth-key-1234 \
            -e ENCRYPTION_SALT=dGVzdC1zYWx0LWZvci1jaS10ZXN0aW5n \
            -e ENCRYPTION_KEY=dGVzdC1rZXktZm9yLWNpLXRlc3Rpbmc= \
            -e ENVIRONMENT=ci \
            -e DATABASE_URL=sqlite:////tmp/smoke_auth.db \
            -p 8004:8002 \
            "$IMAGE"

          # Wait for the container to be healthy
          for i in $(seq 1 20); do
            HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8004/health 2>/dev/null || echo "")
            [ "$HTTP" = "200" ] && break
            [ "$i" -eq 20 ] && (docker logs auth_smoke; exit 1)
            sleep 2
          done
          echo "✓ Backend is healthy"

          # Run Alembic migrations so the auth tables exist
          docker exec auth_smoke sh -c "cd /app && python -m alembic -c ai_receptionist/alembic.ini upgrade head" 2>&1 || true

          # Signup
          SIGNUP=$(curl -s -o /tmp/signup.json -w "%{http_code}" \
            -X POST http://localhost:8004/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@ci.test","password":"Smoke1234!","full_name":"CI Smoke","business_name":"Smoke Co"}')

          echo "Signup HTTP: $SIGNUP"
          cat /tmp/signup.json
          [ "$SIGNUP" = "200" ] || (docker logs auth_smoke; exit 1)
          grep -q "access_token" /tmp/signup.json || (echo "No access_token in signup response"; exit 1)

          # Login
          LOGIN=$(curl -s -o /tmp/login.json -w "%{http_code}" \
            -X POST http://localhost:8004/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@ci.test","password":"Smoke1234!"}')

          echo "Login HTTP: $LOGIN"
          cat /tmp/login.json
          [ "$LOGIN" = "200" ] || (echo "Login returned $LOGIN — auth is broken"; docker logs auth_smoke; exit 1)
          grep -q "access_token" /tmp/login.json || (echo "No access_token in login response"; exit 1)

          echo "✓ Auth signup + login OK"
          docker stop auth_smoke

      - name: Push image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.run_id }}
            ghcr.io/${{ github.repository }}:latest

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy (main + image build passed)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production (blue/green)
    needs: image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOPPLER_TOKEN
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/${{ github.repository }}:${{ github.run_id }}"

            # Install Doppler CLI if not present
            command -v doppler >/dev/null 2>&1 || \
              (curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh)

            # Login to GHCR using GHCR_TOKEN stored in Doppler
            doppler secrets get GHCR_TOKEN --plain | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull "$IMAGE"

            # Determine inactive slot
            ACTIVE=$(docker ps --filter "name=ai_receptionist_blue" --format "{{.Names}}" | head -1)
            if [ -n "$ACTIVE" ]; then
              NEW_SLOT=green; OLD_SLOT=blue
            else
              NEW_SLOT=blue; OLD_SLOT=green
            fi

            # Write secrets to a scoped temp file, remove after container start
            SECRETS_FILE=$(mktemp)
            chmod 600 "$SECRETS_FILE"
            doppler secrets download --format env --no-file > "$SECRETS_FILE"

            docker run -d \
              --name "ai_receptionist_${NEW_SLOT}" \
              --env-file "$SECRETS_FILE" \
              -p 8003:8002 \
              "$IMAGE"

            rm -f "$SECRETS_FILE"

            # Wait for readiness (3 consecutive 200 responses)
            PASS=0
            for _ in $(seq 1 30); do
              HTTP=$(curl -so /dev/null -w "%{http_code}" http://localhost:8003/readiness || echo "000")
              if [ "$HTTP" = "200" ]; then
                PASS=$((PASS+1))
                [ "$PASS" -ge 3 ] && break
              else
                PASS=0
              fi
              sleep 2
            done

            if [ "$PASS" -lt 3 ]; then
              echo "New slot failed readiness check — aborting and removing"
              docker rm -f "ai_receptionist_${NEW_SLOT}" || true
              exit 1
            fi

            # Promote new slot and retire old
            docker rm -f "ai_receptionist_${OLD_SLOT}" 2>/dev/null || true
            docker rename "ai_receptionist_${NEW_SLOT}" ai_receptionist_active 2>/dev/null || true
